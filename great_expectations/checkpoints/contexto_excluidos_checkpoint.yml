name: contexto_excluidos_checkpoint
config_version: 1
class_name: Checkpoint
run_name_template: "%Y%m%d-%H%M%S-etl-agent-contexto_excluidos"
expectation_suite_name: contexto_excluidos_suite
batch_request:
  datasource_name: marts_datasource
  data_connector_name: default_inferred_data_connector_name
  data_asset_name: mart_contexto_excluidos
action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: store_evaluation_params
    action:
      class_name: StoreEvaluationParametersAction
