name: Pipeline (migração real)

# Execução manual de uma migração real. Credenciais vêm de GitHub Secrets:
#   AIRTABLE_API_KEY, CF_API_TOKEN, CF_ACCOUNT_ID, CF_DATABASE_ID
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Ficheiro de config (ex.: config/pipeline.json — commitado SEM segredos)"
        required: false
        default: config/pipeline.json

jobs:
  etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # ler o próprio run/jobs para o registo no dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: "[1] Extract"
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: python extract/run_pipeline.py extract --config ${{ inputs.config }} --db etl_agent.duckdb

      - name: "[2] Transform (dbt)"
        run: dbt run --project-dir dbt --profiles-dir dbt --target dev

      - name: "[3] Validate (Great Expectations — aborta se falhar)"
        working-directory: great_expectations
        run: great_expectations checkpoint run d1_pipeline_checkpoint

      - name: "[4] Load"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: python extract/run_pipeline.py load --config ${{ inputs.config }} --db etl_agent.duckdb

      - name: "[5] Commit do relatório de execução"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
        run: python extract/run_pipeline.py report --config ${{ inputs.config }} --db etl_agent.duckdb

      - name: Publicar relatório no repo (auditoria)
        run: |
          git config user.name "etl-agent-bot"
          git config user.email "etl-agent@users.noreply.github.com"
          git add docs/executions/
          git commit -m "execution report: ${{ inputs.config }}" || echo "sem alterações"
          git push

      - name: Registar execução no dashboard (D1 etl-executions)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python scripts/record_execution.py || echo "registo no D1 falhou (não bloqueia o pipeline)"
