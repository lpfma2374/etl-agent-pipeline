name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check extract dbt scripts

      - name: Gerar dados sintéticos (seed, 200 registos -> 4 lotes)
        run: python scripts/make_seed.py --rows 200

      - name: "Batch-run: pipeline completo por lotes de 50 (extract -> dbt -> GE -> load -> report)"
        run: |
          python extract/run_batches.py \
            --config config/ci.test.json \
            --db etl_agent.duckdb \
            --batch-size 50
          echo "--- verificação de entrega incremental ---"
          python - <<'EOF'
          import duckdb
          con = duckdb.connect("destination.duckdb", read_only=True)
          n = con.execute("SELECT COUNT(*) FROM contacts").fetchone()[0]
          print(f"registos no destino: {n}")
          assert n == 200, f"esperado 200, obtido {n}"
          con.close()
          EOF

      - name: dbt docs (catálogo)
        if: github.ref == 'refs/heads/main'
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --target dev

      - uses: actions/upload-artifact@v4
        with:
          name: execucao-ci
          path: |
            docs/executions/
            target/
            destination.duckdb
          retention-days: 30
